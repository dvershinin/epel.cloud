version: 2.1

jobs:
  tests:
    docker:
      - image: cimg/python:3.12-node
    steps:
      - checkout
      - run:
          name: Install
          command: pip install --disable-pip-version-check -e . pytest
      - run:
          name: Fast test suite
          command: python -m pytest -q
      - run:
          name: Build static site
          command: epelcloud build

  deploy-pages:
    docker:
      - image: cimg/python:3.12-node
    environment:
      CLOUDFLARE_ACCOUNT_ID: bc6ea01224d150af6244b4aa3d42b9ae
    steps:
      - checkout
      - run:
          name: Build
          command: |
            pip install --disable-pip-version-check -e .
            epelcloud build
      - run:
          name: Deploy to Cloudflare Pages (epel-cloud)
          command: npx --yes wrangler@latest pages deploy site --project-name=epel-cloud --branch=main --commit-dirty=true

workflows:
  build-test-deploy:
    jobs:
      - tests
      - deploy-pages:
          requires:
            - tests
          filters:
            branches:
              only: master
